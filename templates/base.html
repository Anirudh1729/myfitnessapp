<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>{% block title %}My Fitness App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>
    <div class="app-container">
        {% block content %}{% endblock %}
    </div>

    {% if request.endpoint not in ['onboarding', 'index'] %}
    <nav class="bottom-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </a>
        <a href="{{ url_for('workout_menu') }}" class="nav-item {% if 'workout' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">💪</span>
            <span class="nav-label">Workout</span>
        </a>
        <a href="{{ url_for('food_menu') }}" class="nav-item {% if 'food' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">🍽️</span>
            <span class="nav-label">Food</span>
        </a>
        <a href="{{ url_for('progress') }}" class="nav-item {% if request.endpoint == 'progress' %}active{% endif %}">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Progress</span>
        </a>
        <a href="{{ url_for('settings') }}" class="nav-item {% if request.endpoint == 'settings' %}active{% endif %}">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
        </a>
    </nav>
    {% endif %}

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
